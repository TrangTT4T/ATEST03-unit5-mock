# Unit 5 mock project: quality gates, then the suite in its container across a
# persona x browser matrix, then one merged quality matrix.
#
#   quality         lint, format, strict types, unit + plugin tests with a coverage ratchet,
#                   requirement/finding coverage gate, workflow lint            (no browser)
#   plan            the persona x target matrix: the standard 8 runs, or what "Run workflow" selected
#   e2e (matrix)    build the test-runner image, run the scenarios inside it   (one persona/browser each):
#                   pull requests run @smoke only (fast feedback); main, nightly and manual runs run all
#   quality-matrix  merge every run's traceability into requirement x run, gate on unexpected failures
name: mock-project

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: the site under test can change without any commit of ours
  workflow_dispatch:
    inputs:
      suite:
        description: Scenarios to run
        type: choice
        options: [all, smoke]
        default: all
      persona:
        description: "Persona (all + target all = the standard 8 runs; otherwise every selected persona x every selected target)"
        type: choice
        options: [all, standard_user, problem_user, performance_glitch_user, error_user, visual_user]
        default: all
      target:
        description: Browser or emulated device
        type: choice
        options: [all, chromium, firefox, webkit, Pixel 7]
        default: all
      run_e2e:
        description: Run the scenarios (off = quality gates only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mock-project-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: swaglabs-tests:ci

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types (mypy strict)
        run: mypy
      - name: Unit and plugin tests, coverage ratchet
        run: pytest tests/unit -n auto --cov --cov-report=term --cov-report=xml:reports/coverage.xml
      - name: Coverage gate - every requirement and every finding has a scenario
        run: pytest --collect-only -q --fail-on-uncovered
      - name: Workflow lint
        run: actionlint .github/workflows/mock-project.yml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: unit-coverage
          path: reports/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  plan:
    needs: quality
    if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Build the persona x target matrix
        id: plan
        env:
          PERSONA: ${{ inputs.persona || 'all' }}
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          personas = ["standard_user", "problem_user", "performance_glitch_user", "error_user", "visual_user"]
          targets = {"chromium": ("chromium", ""), "firefox": ("firefox", ""), "webkit": ("webkit", ""), "Pixel 7": ("chromium", "Pixel 7")}
          standard = [(p, "chromium") for p in personas] + [("standard_user", t) for t in ("firefox", "webkit", "Pixel 7")]
          persona, target = os.environ["PERSONA"], os.environ["TARGET"]
          if persona == "all" and target == "all":
              runs = standard
          else:
              runs = [(p, t) for p in (personas if persona == "all" else [persona])
                             for t in (list(targets) if target == "all" else [target])]
          include = []
          for p, t in runs:
              browser, device = targets[t]
              include.append({"label": f"{p}-{t.replace(' ', '-')}", "persona": p, "browser": browser, "device": device})
          print("matrix=" + json.dumps({"include": include}))
          PY

  e2e:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false  # one persona's result must not hide another's
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Matrix values reach the shell through the environment, never by ${{ }} inside a script.
      PERSONA: ${{ matrix.persona }}
      BROWSER: ${{ matrix.browser }}
      DEVICE: ${{ matrix.device }}
      SUITE: ${{ inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'all') }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the test-runner image
        run: docker build -f docker/Dockerfile -t "$IMAGE" .
      - name: Run the scenarios in the container
        run: |
          mkdir -p reports
          args=(tests/test_scenarios.py -n 4 --browser "$BROWSER")
          if [ -n "$DEVICE" ]; then args+=(--device "$DEVICE"); fi
          if [ "$SUITE" = smoke ]; then args+=(-m smoke); fi
          docker run --rm --init --ipc=host --read-only --tmpfs /tmp:exec \
            -v "$PWD/reports:/work/reports" \
            -e SWAGLABS_PERSONA="$PERSONA" \
            -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW \
            "$IMAGE" "${args[@]}"
      - name: Check the evidence is complete and unchanged
        if: always()
        run: |
          if [ -f reports/manifest.json ]; then python3 -m swaglabs.evidence reports; else echo "no manifest (run did not finish)"; fi
      - name: Job summary
        if: always()
        run: |
          for f in reports/traceability.md reports/perf.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports-${{ matrix.label }}
          path: reports
          retention-days: 14

  quality-matrix:
    needs: e2e
    if: ${{ always() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: all-reports
      - name: Merge the runs into one quality matrix (fails on any unexpected failure)
        run: python3 -m swaglabs.matrix all-reports/*/traceability.json | tee quality-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-matrix
          path: quality-matrix.md
          retention-days: 30
